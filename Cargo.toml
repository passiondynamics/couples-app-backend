[package]
name = "couples-app-backend"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
http = "1.3"
jiff = "0.2"
regex = "1.12"
thiserror = "2.0"
tower = "0.5"
tracing = "0.1"

  [dependencies.argon2]
  version = "0.5"
  features = [
    "std",
  ]

  [dependencies.sqlx]
  version = "0.8"
  features = [
    "macros",
    "runtime-tokio",
    "sqlite",
  ]

  [dependencies.tower-http]
  version = "0.6"
  features = [
    "trace"
  ]

  [dependencies.tokio]
  version = "1.48"
  features = [
    "macros",
    "rt-multi-thread",
    "signal",
  ]

  [dependencies.tracing-subscriber]
  version = "0.3"
  features = [
    "env-filter",
    "json",
  ]
